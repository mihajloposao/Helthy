<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe4">
  <title>Kilaža & Trening</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ekran učitavanja: stoji dok se podaci ne povuku sa servera, pa ga app.js
     sakrije (ili prikaže poruku o grešci ako nema mreže). -->
<div id="ucitavanje">
  <div class="ucit-poruka">
    <strong>Kilaža &amp; Trening</strong>
    <p>Učitavanje…</p>
  </div>
</div>

<main>

  <!-- ======================= EKRAN: DANAS ======================= -->
  <!-- Kilaža (trenutna + ciljana), prsten kalorija, stepper i obroci. Ceo
       sadržaj renderuje renderKilaza u app.js jer je interaktivan. Grafik
       kretanja kilaže je na Istoriji. -->
  <section id="sekcija-kilaza">
    <div id="kilaza-sadrzaj"></div>
  </section>

  <!-- ======================= EKRAN: TRENINZI ======================= -->
  <!-- Samo unos novog treninga. Trening se uvek beleži za DANAŠNJI datum;
       pregled ranijih treninga je na ekranu Istorija (po danu). -->
  <section id="sekcija-treninzi" hidden>
    <header class="ekran-zaglavlje">
      <div>
        <p class="nadnaslov" id="trening-danas-datum"></p>
        <h1>Novi trening</h1>
      </div>
    </header>

    <p class="naslov-sekcije">
      <span class="trening-naslov">
        <svg class="teg-ikona" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        DANAŠNJI TRENING
      </span>
    </p>

    <div class="kartica-forma istaknuta">
      <input id="trening-naziv" type="text" placeholder="Naziv treninga — npr. Gornji deo tela" maxlength="40">
      <div class="red-polja">
        <label>od <input id="trening-od" type="time"></label>
        <label>do <input id="trening-do" type="time"></label>
      </div>
      <textarea id="trening-linije" placeholder="Šta si radio (jedna vežba po redu)&#10;npr. Potisak s klupe — 4×8 · 60 kg" maxlength="600"></textarea>
      <div>
        <p class="teg-naslov">TEŽINA SESIJE <span class="teg-hint">· tapni teg</span></p>
        <div id="trening-tezina" class="teg-birac"></div>
      </div>
      <textarea id="trening-beleska" placeholder="Beleška — kako si se osećao (opciono)" maxlength="300"></textarea>
      <button id="trening-dodaj" class="glavno-dugme">Sačuvaj trening</button>
    </div>
  </section>

  <!-- ======================= EKRAN: TRENING (detalj) ======================= -->
  <!-- Otvara se tapom na trening u Detalju dana; renderuje ga renderTrening. -->
  <section id="sekcija-trening" hidden>
    <div id="trening-sadrzaj"></div>
  </section>

  <!-- ======================= EKRAN: ISTORIJA ======================= -->
  <!-- Pregled po mesecu: sažetak, kalendar obojen po unosu, lista poslednjih
       dana. Tap na dan otvara Detalj dana. Renderuje renderIstorija. -->
  <section id="sekcija-istorija" hidden>
    <header class="ekran-zaglavlje">
      <div>
        <p class="nadnaslov">PREGLED</p>
        <h1 id="istorija-mesec"></h1>
      </div>
      <div class="plan-tabovi">
        <button id="mesec-nazad" class="tab-dugme" title="Prethodni mesec">‹</button>
        <button id="mesec-napred" class="tab-dugme" title="Sledeći mesec">›</button>
      </div>
    </header>

    <!-- Kretanje kilaže: naslov sa prekidačem opsega, grafik i statistika.
         Renderuje ih renderIstorijaKilazu (podaci + interakcija na opsegu). -->
    <div id="istorija-kilaza"></div>

    <div class="kartice-red">
      <div class="kartica tamna">
        <strong id="istorija-treninzi">0</strong>
        <small>treninga u mesecu</small>
      </div>
      <div class="kartica">
        <strong id="istorija-kcal">—</strong>
        <small>prosek kcal / dan</small>
      </div>
    </div>

    <div id="istorija-kalendar" class="kalendar"></div>
    <div class="legenda">
      <span><i class="kocka" style="background:#44659e"></i> trening</span>
      <span><i class="kocka pola"></i> samo obroci</span>
      <span><i class="kocka prazan"></i> bez unosa</span>
    </div>

    <p class="naslov-sekcije">POSLEDNJI DANI</p>
    <div id="istorija-dani" class="lista"></div>
  </section>

  <!-- ======================= EKRAN: DETALJ DANA ======================= -->
  <!-- Sav sadržaj (obroci sa zbirom + treninzi tog dana) renderuje
       renderDetalj u #detalj-sadrzaj. -->
  <section id="sekcija-detalj" hidden>
    <header class="ekran-zaglavlje">
      <div>
        <button id="detalj-nazad" class="nazad-dugme">‹ Istorija</button>
        <p class="nadnaslov" id="detalj-dan"></p>
        <h1 id="detalj-datum"></h1>
      </div>
      <div class="zbir">
        <strong id="detalj-ukupno">0</strong>
        <small>kcal ukupno</small>
      </div>
    </header>
    <div id="detalj-sadrzaj"></div>
  </section>

</main>

<!-- ======================= DONJA NAVIGACIJA ======================= -->
<nav class="donja-nav">
  <button class="nav-dugme" data-sekcija="kilaza">
    <svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 16l3.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 16h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Kilaža
  </button>
  <button class="nav-dugme" data-sekcija="treninzi">
    <svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Trening
  </button>
  <button class="nav-dugme" data-sekcija="istorija">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Istorija
  </button>
</nav>

<script src="storage.js"></script>
<script src="app.js"></script>
<script>
  // Registracija service worker-a za PWA (offline rad + instalacija na telefon).
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  }

  // Sprečava zumiranje da se prikaz ne "mulja".
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && ["+", "-", "=", "0"].indexOf(e.key) !== -1) {
      e.preventDefault();
    }
  });
</script>
</body>
</html>
